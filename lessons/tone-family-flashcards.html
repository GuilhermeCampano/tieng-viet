<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tone Family Flashcards</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 1rem; background: #f4f4f5; margin: 0; min-height: 100vh; justify-content: center; }
  #card { width: min(90vw, 480px); min-height: 260px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.12); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .75rem; padding: 2rem; cursor: pointer; user-select: none; text-align: center; }
  #word { font-size: 3rem; font-weight: 700; }
  #tone { color: #6366f1; font-weight: 600; }
  #meaning { font-size: 1.4rem; }
  #sentence { color: #52525b; font-style: italic; }
  #progress { color: #71717a; }
  .buttons { display: flex; gap: 1rem; }
  button { padding: .6rem 1.4rem; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; color: #fff; }
  #again { background: #ef4444; } #good { background: #22c55e; } #easy { background: #3b82f6; }
  #back { background: #71717a; }
</style>
</head>
<body>
  <div id="card">
    <div id="word"></div>
    <div id="tone"></div>
    <div id="meaning"></div>
    <div id="sentence"></div>
  </div>
  <div class="buttons">
    <button id="back">Back</button>
    <button id="again">Again</button>
    <button id="good">Good</button>
    <button id="easy">Easy</button>
  </div>
  <div id="progress"></div>

<script>
const cards = [{"word": "đắp", "tone": "sắc (short ă)", "meaning": "to cover, to build up (wall), to apply (plaster)", "sentence": "Em đắp chăn khi lạnh. — I cover myself with a blanket when cold."}, {"word": "đáp", "tone": "sắc (long a)", "meaning": "to land; to answer; to board (transport) — Hán-Việt 答", "sentence": "Máy bay đáp xuống sân bay. — The plane landed at the airport."}, {"word": "đạp", "tone": "nặng", "meaning": "to pedal, to kick, to tread", "sentence": "Tôi đạp xe đi làm. — I ride my bike to work."}, {"word": "đập", "tone": "nặng (âp)", "meaning": "to hit, to beat, to slam shut", "sentence": "Đừng đập cửa! — Don't bang the door!"}, {"word": "đặt", "tone": "nặng (đăt)", "meaning": "to place, put; to book, order", "sentence": "Đặt gối sau lưng. — Put the pillow behind your back."}, {"word": "đắt", "tone": "sắc (đăt)", "meaning": "expensive", "sentence": "Cái này đắt quá! — This is so expensive!"}, {"word": "đất", "tone": "sắc (đât, â)", "meaning": "land, soil, earth", "sentence": "đất nước — country"}, {"word": "đạt", "tone": "nặng (đat, long)", "meaning": "to reach, achieve — Hán-Việt 達", "sentence": "đạt được — to achieve"}, {"word": "la", "tone": "ngang", "meaning": "to shout, yell, scold", "sentence": "Mẹ la con vì không học bài. — Mom scolds the kid for not studying."}, {"word": "là", "tone": "huyền", "meaning": "to be (copula)", "sentence": "Tôi là người Brasil. — I'm Brazilian."}, {"word": "lá", "tone": "sắc", "meaning": "leaf; sheet (of paper)", "sentence": "Lá cây màu xanh. — The leaf is green."}, {"word": "lả", "tone": "hỏi", "meaning": "tired, weak, limp", "sentence": "Chạy xong mệt lả người. — Exhausted after running."}, {"word": "lã", "tone": "ngã", "meaning": "fine silk, gauze; interest (finance)", "sentence": "Lụa là / lãi suất — silk / interest rate"}, {"word": "lạ", "tone": "nặng", "meaning": "strange, unfamiliar, unusual", "sentence": "Món này lạ quá! — This dish is so unusual!"}, {"word": "cần", "tone": "huyền", "meaning": "to need; (cần câu — fishing rod)", "sentence": "Tôi cần rửa chén. — I need to wash the dishes."}, {"word": "cấn", "tone": "sắc (â)", "meaning": "to be wedged/trapped; to bump against", "sentence": "Cái gì đó cấn ở lưng tôi. — Something's pressing on my back."}, {"word": "cản", "tone": "hỏi", "meaning": "to block, to obstruct", "sentence": "Xin đừng cản đường! — Please don't block the way!"}, {"word": "căn", "tone": "ngang (â)", "meaning": "root (Hán-Việt 根); room", "sentence": "căn phòng — room"}];

let order = shuffle(cards.map((_, i) => i));
let pos = 0;
let flipped = false;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function show() {
  const c = cards[order[pos]];
  document.getElementById("word").textContent = c.word;
  document.getElementById("tone").textContent = flipped ? c.tone : "";
  document.getElementById("meaning").textContent = flipped ? c.meaning : "";
  document.getElementById("sentence").textContent = flipped ? c.sentence : "";
  document.getElementById("progress").textContent = `${pos + 1} / ${cards.length}`;
}

document.getElementById("card").addEventListener("click", () => { flipped = !flipped; show(); });

function next(gap) {
  if (gap > 1 && pos + 1 < cards.length) {
    const card = order.splice(pos, 1)[0];
    order.splice(Math.min(pos + gap, order.length), 0, card);
  }
  pos = (pos + 1) % cards.length;
  flipped = false;
  show();
}

document.getElementById("back").addEventListener("click", () => { order = shuffle(cards.map((_, i) => i)); pos = 0; flipped = false; show(); });
document.getElementById("again").addEventListener("click", () => next(0));
document.getElementById("good").addEventListener("click", () => next(1));
document.getElementById("easy").addEventListener("click", () => next(2));

show();
</script>
</body>
</html>
